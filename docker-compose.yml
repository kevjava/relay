version: '3.8'

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-cms
    ports:
      - "8080:80"
    volumes:
      # :z relabels the bind mounts for SELinux hosts (Fedora, RHEL) so any
      # container can read them; it is ignored where SELinux is not enabled
      - .:/var/www/html:z
      - ./config:/var/www/html/config:z
      - ./content:/var/www/html/content:z
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
      - PHP_MEMORY_LIMIT=256M
    restart: unless-stopped
    networks:
      - relay-network

networks:
  relay-network:
    driver: bridge
